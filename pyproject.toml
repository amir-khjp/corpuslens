[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpuslens"
version = "0.1.0"
description = "Automated EDA and data-mining reports for text/NLP datasets — pandas-profiling for text, with optional LLM-powered insights."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CorpusLens contributors" }]
requires-python = ">=3.9"
keywords = ["nlp", "data-mining", "eda", "text-analysis", "data-profiling", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "jinja2>=3.1",
    "click>=8.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "build>=1.0"]

[project.scripts]
corpuslens = "corpuslens.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/corpuslens"
Issues = "https://github.com/yourusername/corpuslens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corpuslens = ["templates/*.jinja"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
